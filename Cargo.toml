[package]
name = "zoomie-lint"
version = "0.1.0"
edition = "2021"
description = "Extremely fast, rule-language driven linter with structural (bracket/quote aware) pattern matching"
license = "MIT"
default-run = "zlint"

[[bin]]
name = "zlint"
path = "src/main.rs"

[dependencies]
memchr = "2.7"
regex-automata = "0.4"
regex-syntax = "0.8"
ignore = "0.4"
globset = "0.4"
clap = { version = "4.5", features = ["derive"] }
anstream = "0.6"
anstyle = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Rule expressions compiled to native code (src/jit).
cranelift-codegen = "0.136"
cranelift-frontend = "0.136"
cranelift-jit = "0.136"
cranelift-module = "0.136"
cranelift-native = "0.136"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
