[package]
name = "dxlint"
version = "0.1.0"
edition = "2021"
description = "Extremely fast, rule-language driven linter with structural (bracket/quote aware) pattern matching"
license = "MIT"
default-run = "dxlint"

[[bin]]
name = "dxlint"
path = "src/main.rs"

[workspace]
members = ["crates/dx-pattern", "crates/dx-core", "crates/dx-tree", "crates/dx-ir", "crates/dx-config", "crates/dx-grammar", "crates/dx-names", "crates/dx-semantic", "crates/dx-runtime"]

[dependencies]
dx-pattern = { path = "crates/dx-pattern" }
dx-core = { path = "crates/dx-core" }
dx-tree = { path = "crates/dx-tree" }
dx-ir = { path = "crates/dx-ir" }
dx-config = { path = "crates/dx-config" }
dx-grammar = { path = "crates/dx-grammar" }
dx-names = { path = "crates/dx-names" }
dx-semantic = { path = "crates/dx-semantic" }
dx-runtime = { path = "crates/dx-runtime" }
memchr = "2.7"
regex-automata = "0.4"
regex-syntax = "0.8"
ignore = "0.4"
globset = "0.4"
clap = { version = "4.5", features = ["derive"] }
anstream = "0.6"
anstyle = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Measuring builds: exact work counts and a census of repeated facts (crates/dx-core/src/work.rs).
work = ["dx-core/work", "dx-grammar/work", "dx-names/work", "dx-semantic/work", "dx-runtime/work"]

[profile.dev]
opt-level = 1
debug = 1
debug-assertions = true
overflow-checks = true
# Local ThinLTO is most of every incremental rebuild; release still links with LTO.
lto = "off"

[profile.dev.package."*"]
opt-level = 3
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# The host binary checkouts linking package/ run between releases
# (`npm run build:local`): incremental, so an engine change reaches them in
# minutes; releases still ship `release` builds.
[profile.local]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
