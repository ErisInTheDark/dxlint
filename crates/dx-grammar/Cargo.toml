[package]
name = "dx-grammar"
version = "0.1.0"
edition = "2021"
description = "Matcher layers, declared parsers and name resolution: the language-neutral grammar table"
license = "MIT"

[dependencies]
dx-config = { path = "../dx-config" }
dx-core = { path = "../dx-core" }
dx-tree = { path = "../dx-tree" }
dx-ir = { path = "../dx-ir" }
dx-pattern = { path = "../dx-pattern" }
memchr = "2.7"
regex-automata = "0.4"
regex-syntax = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
work = ["dx-core/work"]
